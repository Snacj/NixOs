<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tray icon for wayscriber.

  The nixpkgs wayscriber package ships only a binary, so the "wayscriber"
  IconName it advertises over StatusNotifierItem resolves to nothing and tray
  hosts draw a broken-image placeholder instead. Installed into the user's
  hicolor theme by home/quickshell.nix.

  Greys and the inked tip come from quickshell's Theme.qml, so the pencil reads
  as part of the bar rather than as a foreign app icon. Drawn upright, then
  rotated onto the diagonal: the nudge before the rotation recentres the
  bounding box, which rotating a tapered shape throws off.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g transform="translate(12 12) scale(1.3) translate(-12 -12)">
    <g transform="translate(-0.92 0.92) rotate(45 12 12)">
      <!-- shaft -->
      <path d="M9.9 3.6h4.2a1.1 1.1 0 0 1 1.1 1.1v9.9H8.8V4.7a1.1 1.1 0 0 1 1.1-1.1z" fill="#e0e0e0"/>
      <!-- sharpened wood -->
      <path d="M8.8 14.6h6.4L12 21z" fill="#b4b4b4"/>
      <!-- inked tip -->
      <path d="M10.6 18.2h2.8L12 21z" fill="#d8b64a"/>
    </g>
  </g>
</svg>
