general {
    hide_cursor = true
    grace = 5
}

background {
    monitor =
    path = /home/snacj/Pictures/Wallpapers/nix.jpg
    blur_passes = 0
    blur_size = 0
    noise = 0
    contrast = 1
    brightness = 0.85
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgba(100, 180, 255, 0.4)
    inner_color = rgba(10, 10, 30, 0.7)
    font_color = rgb(200, 220, 255)
    fade_on_empty = true
    placeholder_text = <i>keycode</i>
    position = 0, -40
    halign = center
    valign = center
    rounding = 12
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 72
    font_family = Sans Bold
    color = rgba(200, 220, 255, 0.9)
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    font_size = 20
    font_family = Sans
    color = rgba(150, 180, 220, 0.7)
    position = 0, 60
    halign = center
    valign = center
}
