general {
    hide_cursor = true
    grace = 5
    text_trim = true
}

background {
    monitor =
    color = rgba(10, 10, 10)
    #path = /home/snacj/Pictures/Wallpapers/nix.jpg
    brightness = 0.2
    blur-passes = 5
    blur-size = 3
    noise = 0.4
}

# outer terminal panel
shape {
    monitor =
    size = 680, 300
    color = rgba(0, 0, 0, 0.9)
    border_size = 2
    border_color = rgb(220, 220, 220)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# clock at the top
label {
    monitor =
    text = cmd[update:1000] date "+%Y-%m-%d  %H:%M:%S"
    font_size = 18
    font_family = BigBlueTerm437 Nerd Font
    color = rgba(200, 200, 200, 0.85)
    position = 0, 210
    halign = center
    valign = center
}

# panel title, centered
label {
    monitor =
    text = cmd[update:0] echo "$(hostname) entry code"
    font_size = 16
    font_family = BigBlueTerm437 Nerd Font
    color = rgb(235, 235, 235)
    position = 0, 112
    halign = center
    valign = center
}

# username label
label {
    monitor =
    text = Username:
    font_size = 16
    font_family = BigBlueTerm437 Nerd Font
    color = rgb(235, 235, 235)
    position = -170, 52
    halign = center
    valign = center
}

# username value
label {
    monitor =
    text = cmd[update:0] echo "$(whoami)"
    font_size = 16
    font_family = BigBlueTerm437 Nerd Font
    color = rgb(235, 235, 235)
    position = -45, 52
    halign = center
    valign = center
}

# prompt label + input, on one line
label {
    monitor =
    text = Password:
    font_size = 16
    font_family = BigBlueTerm437 Nerd Font
    color = rgb(225, 225, 225)
    position = -170, -8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 34
    outline_thickness = 1
    dots_size = 0.5
    dots_spacing = 0.15
    dots_center = false
    dots_rounding = 0
    dots_text_format = *
    outer_color = rgb(220, 220, 220)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgb(230, 230, 230)
    font_family = BigBlueTerm437 Nerd Font
    fade_on_empty = false
    fade_timeout = 0
    placeholder_text =
    hide_input = false
    rounding = 0
    check_color = rgb(235, 235, 235)
    fail_color = rgb(120, 120, 120)
    fail_text = $FAIL  ($ATTEMPTS)
    fail_timeout = 4000
    capslock_color = rgb(255, 255, 255)
    numlock_color = -1
    invert_numlock = false
    position = 55, -12
    halign = center
    valign = center
}

# keyboard layout / capslock hint under the field
label {
    monitor =
    text = $LAYOUT
    font_size = 12
    font_family = BigBlueTerm437 Nerd Font
    color = rgba(170, 170, 170, 0.7)
    position = 0, -70
    halign = center
    valign = center
}

# bottom key hints, like tuigreet's function-key bar
label {
    monitor =
    text = [ Return ] unlock       [ Esc ] clear input
    font_size = 14
    font_family = BigBlueTerm437 Nerd Font
    color = rgba(170, 170, 170, 0.7)
    position = 0, -210
    halign = center
    valign = center
}
